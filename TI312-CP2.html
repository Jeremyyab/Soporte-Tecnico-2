<script>
/* ═══════════════════════════════════════════════
   TI-312 · Caso Práctico 2 — Red con Wi-Fi e IoT
   Para editar: cambiá el contenido de "slides".
   Cada slide: kicker, title, desc, html, badges, img
═══════════════════════════════════════════════ */
window.DECK = {
  title:"Caso Práctico 2 — Red con Wi-Fi e IoT",
  sub:"TI-312 · Semana 2 — Laboratorio en Packet Tracer",
  theme:"cp",
  pills:["Grupal","Packet Tracer"],
  links:[{"label":"📖 Clase Semana 2","href":"TI312-Semana2-Redes.html"}],
  slides:[
    /* ── CASO PRÁCTICO 2 ── */
    {
      kicker:"CASO PRÁCTICO 2",
      title:"Red con Wi-Fi, IoT y ACL",
      desc:"Extendemos la red del CP1 con un AP inalámbrico, laptops por Wi-Fi, un sensor IoT y una ACL básica.",
      html:`
          <div class="grid">
          <div class="card"><strong>📌 Datos del caso</strong><ul><li>Semana 2 de 4</li><li>Valor: 15% (de 45% en casos)</li><li>Grupos de 3–4 personas</li><li>Duración: ~80 minutos en clase</li></ul></div>
          <div class="card"><strong>🧰 Necesitás</strong><ul><li>Archivo .pkt del CP1</li><li>Packet Tracer 8.2.2</li><li>Wireless Router WRT300N y dispositivos IoT</li></ul></div>
          </div>
          <div class="bigcard"><div class="title">📋 Escenario</div><div style="color:var(--muted);font-size:13px;line-height:1.6"><b>TechSol S.A.</b> ahora tiene empleados con laptops que necesitan Wi-Fi y un sensor de temperatura IoT en el área de servidores. Deben extender la red del CP1 sin romper lo que ya funciona.</div></div>
          <div class="warnBox"><div class="wtitle">⚠ Misma versión de Packet Tracer en todo el grupo</div><p>Usen Packet Tracer 8.2.2 (estable). La 9.0 está en beta y hay reportes de archivos .pkt que no abren entre 8.2.x y 9.0. <span class="updBadge">2026</span></p></div>
          <div class="ctaRow"><a class="btn" href="TI312-Semana2-Redes.html">📖 Ver la clase de la Semana 2</a></div>`,
      badges:{ak:"Valor",av:"15%",bk:"Duración",bv:"~80 min"},
      img:"images/cp2-portada.svg"
    },

    /* ── 01 · CASO PRÁCTICO 2 ── */
    {
      kicker:"HERRAMIENTA Y OBJETIVOS",
      title:"Laboratorio — Red con Wi-Fi e IoT",
      desc:"Extendemos la red del Caso 1 agregando conectividad inalámbrica y un dispositivo IoT.",
      html:`
          <div class="labBox"><div class="ltitle">🧪 Herramienta: Cisco Packet Tracer</div><p>Wireless Router WRT300N para el AP · Dispositivos IoT disponibles en End Devices.</p></div>
          <div class="bigcard"><div class="title">📋 Escenario</div><div style="color:var(--muted);font-size:13px;line-height:1.6">TechSol S.A. ahora tiene empleados con laptops que necesitan Wi-Fi y un sensor de temperatura IoT en el área de servidores. Deben extender la red del CP1 con estas capacidades nuevas.</div></div>
          <div class="bigcard"><div class="title">🎯 Objetivos</div><ul><li>Agregar y configurar un AP (WRT300N)</li><li>Conectar 2 laptops por Wi-Fi</li><li>Agregar 1 dispositivo IoT a la red</li><li>Aplicar una ACL básica en el router</li><li>Verificar conectividad completa</li></ul></div>`,
      badges:{ak:"Grupos de",av:"3–4 personas",bk:"Duración",bv:"~80 minutos"},
      img:"images/cp2-topologia.svg"
    },

    /* ── 02 · INSTRUCCIONES ── */
    {
      kicker:"INSTRUCCIONES",
      title:"Pasos del laboratorio — Caso 2",
      desc:"Trabajás sobre el archivo del CP1. Si no lo tenés, creá uno nuevo con la topología base.",
      html:`
          <div class="bigcard"><div class="title">Paso a paso</div><ol class="stepList">
          <li>Abrir el archivo del CP1 y guardarlo como <b>TI312-CP2-NombreGrupo.pkt</b>.</li>
          <li>Agregar un <b>WRT300N</b> (Network Devices → Wireless Devices). Conectar su puerto <b>Ethernet 1</b> al <b>Fa0/5</b> del Switch0 con Straight-Through. <i>No uses el puerto Internet.</i></li>
          <li>Configurar el WRT300N por GUI: IP <b>192.168.10.254</b>, DHCP <b>Disabled</b>, SSID <b>TechSol-WiFi</b>, canal 6, WPA2 Personal · AES · <b>Soporte2026</b>.</li>
          <li>Agregar 2 <b>Laptop-PT</b> y cambiarles la tarjeta: Physical → apagar → sacar <b>PT-LAPTOP-NM-1CFE</b> → poner <b>WPC300N</b> → encender.</li>
          <li>Conectar cada laptop: Config → Wireless0 → SSID, WPA2-PSK, clave. IPs <b>.20</b> y <b>.21</b>, gateway <b>.1</b>.</li>
          <li>Agregar 1 dispositivo IoT (End Devices → <b>Home</b>) al <b>Fa0/12</b> del Switch0. IP <b>192.168.10.50</b>, gateway .1.</li>
          <li>Verificar: laptop → PC0 · laptop → IoT · IoT → gateway · laptop → servidor.</li>
          <li><b>Reto avanzado:</b> mover el IoT a la VLAN 20 y bloquearle el servidor con una ACL (ver siguiente slide).</li>
          </ol></div>
          <div class="debateBox"><div class="dtitle">💡 Pregunta durante el lab</div><p>¿Por qué el WRT300N funciona como AP y también como router? ¿En qué modo lo estamos usando aquí y por qué?</p></div>`,
      badges:{ak:"Red a usar",av:"192.168.10.0/24",bk:"AP",bv:"WRT300N"},
      img:"images/s2-instrucciones.svg"
    },

    /* ── 03 · CONFIGURACIÓN AP ── */
    {
      kicker:"CONFIGURACIÓN AP",
      title:"Cómo configurar el WRT300N en PT",
      desc:"El wireless router se configura por su interfaz gráfica dentro de Packet Tracer.",
      html:`
          <div class="bigcard"><div class="title">WRT300N → pestaña GUI (guardá con Save Settings en cada página)</div><ol class="stepList">
          <li><b>Setup → Basic Setup:</b> Router IP <b>192.168.10.254</b> / 255.255.255.0 · DHCP Server <b>Disabled</b>.</li>
          <li><b>Wireless → Basic Wireless Settings:</b> SSID <b>TechSol-WiFi</b> · Standard Channel <b>6</b>.</li>
          <li><b>Wireless → Wireless Security:</b> WPA2 Personal · Encryption <b>AES</b> · Passphrase <b>Soporte2026</b>.</li>
          </ol></div>
          <div class="bigcard amber"><div class="title">Laptop: primero la tarjeta Wi-Fi</div><div style="color:var(--muted);font-size:13px;line-height:1.6">La Laptop-PT viene con tarjeta de cable. En <b>Physical</b>: botón de encendido (apagar) → arrastrar <b>PT-LAPTOP-NM-1CFE</b> hacia la lista de módulos → arrastrar <b>WPC300N</b> al hueco vacío → encender. Luego <b>Config → Wireless0</b>: SSID TechSol-WiFi · WPA2-PSK · Soporte2026 · AES. En <b>Desktop → IP Configuration</b>: 192.168.10.20, máscara /24, gateway 192.168.10.1.</div></div>
          <div class="warnBox"><div class="wtitle">⚠ ¿Por qué DHCP Disabled?</div><p>El WRT300N trae su propio DHCP (192.168.0.x). Si queda encendido, reparte IPs de otra red a quien se conecte y aparece un "doble DHCP".</p></div>`,
      badges:{ak:"IP del AP",av:"192.168.10.254",bk:"DHCP del WRT300N",bv:"Desactivado"},
      img:"images/s2-ap.svg"
    },

    /* ── RETO AVANZADO ── */
    {
      kicker:"RETO AVANZADO",
      title:"IoT en su propia VLAN + ACL",
      desc:"Una ACL solo filtra lo que pasa por el router. Si el IoT y el servidor están en la misma red, el tráfico nunca llega al router: primero hay que separar al IoT en otra VLAN.",
      html:`
          <div class="grid">
          <div class="card"><strong>Switch0 · CLI</strong><pre style="margin:6px 0 0;font-size:11.5px;line-height:1.5;white-space:pre-wrap">enable
configure terminal
vlan 20
 name IOT
interface fa0/12
 switchport mode access
 switchport access vlan 20
interface gi0/1
 switchport mode trunk
end</pre></div>
          <div class="card"><strong>Router · CLI</strong><pre style="margin:6px 0 0;font-size:11.5px;line-height:1.5;white-space:pre-wrap">enable
configure terminal
interface g0/0.20
 encapsulation dot1Q 20
 ip address 192.168.20.1 255.255.255.0
access-list 120 deny ip 192.168.20.0 0.0.0.255 host 192.168.10.2
access-list 120 permit ip any any
interface g0/0.20
 ip access-group 120 in
end
write memory</pre></div>
          </div>
          <div class="bigcard"><div class="title">Cambiar el IoT y probar</div><ul><li>IoT: IP <b>192.168.20.50</b> · gateway <b>192.168.20.1</b></li><li>IoT → 192.168.20.1 y IoT → PC0: <b>responde</b></li><li>IoT → servidor 192.168.10.2: <b>Destination host unreachable</b> (la ACL lo bloquea)</li><li>Verificar en el router: <code>show access-lists</code> muestra los "matches"</li></ul></div>`,
      badges:{ak:"VLAN IoT",av:"20 · 192.168.20.0/24",bk:"ACL",bv:"120 in en G0/0.20"},
      img:"images/cp2-topologia.svg"
    },

    /* ── 04 · RETROALIMENTACIÓN ── */
    {
      kicker:"RETROALIMENTACIÓN",
      title:"Revisión del Caso Práctico 2",
      desc:"Cada grupo comparte su implementación. Analizamos decisiones técnicas.",
      html:`
          <div class="bigcard green"><div class="title">✅ ¿Qué revisamos?</div><ul><li>¿El AP está correctamente configurado?</li><li>¿Las laptops se conectaron al SSID?</li><li>¿El dispositivo IoT tiene IP válida?</li><li>¿El ping entre todos los dispositivos funciona?</li><li>¿La documentación es clara?</li></ul></div>
          <div class="bigcard"><div class="title">💬 Discusión grupal</div><div style="color:var(--muted);font-size:13px;line-height:1.6">Cada grupo — 2 minutos:<br>1) ¿Pusieron el IoT en VLAN separada? ¿Por qué sí o no?<br>2) ¿Qué pasaría si dos APs usan el mismo canal?<br>3) ¿Qué ACL aplicarían en producción?</div></div>
          <div class="revealRow">
          <button class="btn primary" data-reveal="r1">Ver errores frecuentes</button>
          <button class="btn" data-hide="r1">Ocultar</button>
          </div>
          <div class="revealBox" id="r1">Errores comunes: laptop sin cambiar a WPC300N · olvidar Save Settings en el GUI · SSID con mayúsculas distintas · DHCP del WRT300N encendido · cable al puerto Internet en vez de Ethernet 1 · ACL aplicada en G0/0 (no filtra tráfico dentro de la misma red).</div>`,
      badges:{ak:"Por grupo",av:"2 minutos",bk:"Criterio",bv:"Evidencia técnica"},
      img:"images/s2-retro.svg"
    }
,

    /* ── ENTREGA ── */
    {
      kicker:"ENTREGA",
      title:"Entrega del Caso Práctico 2",
      desc:"Todo se sube al LMS antes de terminar la clase. Un solo integrante sube por el grupo.",
      html:`
          <div class="bigcard green"><div class="title">✅ Checklist de entrega</div><ul>
          <li>Archivo <code>TI312-CP2-NombreGrupo.pkt</code> que abra y funcione</li>
          <li>Captura de la topología con todos los enlaces en verde</li>
          <li>Tabla de direccionamiento IP actualizada</li>
          <li>Configuración del AP: SSID, canal, seguridad WPA2</li>
          <li>Capturas de pings laptop → PC0, laptop → IoT, IoT → gateway</li>
          <li>ACL aplicada (si hicieron el reto avanzado)</li>
          <li>Respuesta escrita a la pregunta guía del laboratorio</li>
          <li>Un problema que encontraron y cómo lo resolvieron</li></ul></div>
          <div class="bigcard"><div class="title">📦 Formato</div><div style="color:var(--muted);font-size:13px;line-height:1.6">Un PDF con capturas y respuestas + el archivo .pkt. Nombre: <code>TI312-CP2-NombreGrupo</code>.</div></div>
          <div class="ctaRow"><a class="btn" href="TI312-Semana2-Redes.html">📖 Volver a la clase</a><a class="btn home" href="index.html">← Índice del curso</a></div>`,
      badges:{ak:"Entrega",av:"LMS · hoy",bk:"Este CP vale",bv:"15%"},
      img:"images/cp-entrega.svg"
    }

};
</script>
