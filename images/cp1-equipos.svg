<text x="646" y="432" font-family="Arial,sans-serif" font-size="11" font-weight="normal" fill="#50607a" text-anchor="middle">Tiene su propia NIC</text>
<text x="646" y="448" font-family="Arial,sans-serif" font-size="11" font-weight="normal" fill="#50607a" text-anchor="middle">y una IP fija, como una PC</text>
<text x="400" y="484" font-family="Arial,sans-serif" font-size="11" font-weight="normal" fill="#50607a" text-anchor="middle">Ilustraciones de referencia — en Packet Tracer cada equipo es un ícono, pero los puertos se llaman igual</text>
